name: Compila APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Chiave di firma (dai secret del repository)
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > app/presenze.keystore
            echo "Chiave di firma caricata."
          else
            echo "::warning::Secret KEYSTORE_BASE64 mancante: APK firmato con chiave di prova (gli aggiornamenti futuri richiederanno di disinstallare)."
          fi
      - name: Compila
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rinomina
        run: cp app/build/outputs/apk/release/app-release.apk presenze-preziosina.apk
      - uses: actions/upload-artifact@v4
        with:
          name: presenze-preziosina-apk
          path: presenze-preziosina.apk
